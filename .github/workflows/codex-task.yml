name: Codex task

on:
  workflow_dispatch:
    inputs:
      task:
        description: What should Codex change?
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  codex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Ask Codex to make the change
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            Make the requested change in this repository:
            ${{ inputs.task }}

      - name: Open a pull request with the changes
        uses: peter-evans/create-pull-request@v8
        with:
          branch: codex/task-${{ github.run_id }}
          commit-message: "Codex: implement requested change"
          title: "Codex task"
          body: "Changes proposed by Codex. Please review before merging."
